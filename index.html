<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyLink Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<style>
:root{--hdr:#021841;--bg:#E5EEF9;--btnB:#0A3C6D;--btnO:#F39C12;--green:#2ECC71;--card:#fff;--txt:#111;--sub:#555;--brd:#ccc;--nav:#fff;--inp:#fff;}
body.dark{--bg:#0f1923;--card:#1a2636;--txt:#f0f0f0;--sub:#aab;--brd:#2e3f52;--nav:#121e2d;--inp:#1a2636;--hdr:#0a1e35;}
*{box-sizing:border-box;transition:background .3s,color .2s;}
body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);padding-bottom:100px;color:var(--txt);}
.hdr{background:var(--hdr);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;}
.page{max-width:500px;margin:auto;padding:14px;display:none;}
.active-page{display:block;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.1);position:relative;}
.card.grp{border:2px solid var(--btnO);}
.row{display:flex;gap:10px;margin-bottom:10px;}
.avatar{width:64px;height:64px;background:#ddd;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
.details b{font-size:16px;color:var(--btnB);display:block;}
body.dark .details b{color:#7cb8ff;}
.details p{margin:2px 0;font-size:12px;color:var(--sub);}
.btn{background:var(--btnB);color:#fff;border:none;padding:11px;border-radius:10px;width:100%;font-size:14px;font-weight:bold;cursor:pointer;margin-top:4px;}
.btn.o{background:var(--btnO);}
.btn.g{background:#27ae60;}
.btn.r{background:#e74c3c;}
.badge-status{position:absolute;bottom:12px;right:12px;background:#e8f8ef;color:var(--green);border:1.5px solid var(--green);padding:3px 9px;border-radius:20px;font-size:10px;font-weight:bold;}
body.dark .badge-status{background:#0f2e1e;}
.nav{position:fixed;bottom:0;width:100%;background:var(--nav);display:flex;justify-content:space-around;padding:9px 0;border-top:1px solid var(--brd);z-index:1000;}
.ni{text-align:center;font-size:10px;color:#7f8c8d;cursor:pointer;flex:1;position:relative;}
.ni.active{color:var(--btnB);font-weight:bold;}
body.dark .ni.active{color:#7cb8ff;}
.ni-icon{font-size:22px;display:block;}
.nbadge{position:absolute;top:0;right:10px;background:#e74c3c;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:bold;}
input,textarea,select{width:100%;padding:11px;margin:6px 0;border:1px solid var(--brd);border-radius:10px;font-size:14px;background:var(--inp);color:var(--txt);}
.tag-wrap{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;}
.tag{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:bold;border:2px solid var(--btnB);color:var(--btnB);cursor:pointer;background:transparent;user-select:none;}
body.dark .tag{border-color:#7cb8ff;color:#7cb8ff;}
.tag.sel{background:var(--btnB);color:#fff;}
body.dark .tag.sel{background:#7cb8ff;color:#0f1923;}
.tbadge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:bold;margin:2px;background:#e8f0fb;color:var(--btnB);}
body.dark .tbadge{background:#1e3050;color:#7cb8ff;}
.dark-btn{background:none;border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px;font-weight:bold;}
.fav-btn{position:absolute;top:10px;right:10px;background:none;border:none;font-size:20px;cursor:pointer;}
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#021841;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:9999;display:none;box-shadow:0 4px 15px rgba(0,0,0,.3);white-space:nowrap;}
.stabs{display:flex;gap:6px;margin-bottom:10px;}
.stab{flex:1;padding:8px;border-radius:10px;border:none;background:var(--card);color:var(--sub);font-weight:bold;cursor:pointer;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.stab.active{background:var(--btnB);color:#fff;}
#chatWin{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:2000;display:none;flex-direction:column;}
#chatHdr{background:var(--hdr);color:#fff;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
#msgBox{flex:1;padding:14px;overflow-y:auto;}
.chat-bottom{flex-shrink:0;background:var(--card);border-top:1px solid var(--brd);}
.cin-row{display:flex;gap:5px;padding:5px 10px 9px;align-items:center;}
.cin-row input{margin:0;flex:1;padding:10px 13px;border-radius:22px;font-size:13px;}
.send-btn{background:var(--btnB);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bw{margin-bottom:9px;}
.bw.self{text-align:right;}
.bw.other{text-align:left;}
.bubble{display:inline-block;max-width:80%;padding:9px 13px;border-radius:17px;word-wrap:break-word;font-size:13px;}
.bubble.self{background:var(--btnB);color:#fff;border-bottom-right-radius:3px;}
.bubble.other{background:var(--card);color:var(--txt);border-bottom-left-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.1);}
body.dark .bubble.other{background:#243448;}
.btime{font-size:9px;opacity:.6;margin-top:2px;}
.inbox-item{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;border-bottom:1px solid var(--brd);}
.inbox-avatar{width:48px;height:48px;background:#ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.inbox-info{flex:1;overflow:hidden;}
.inbox-info b{font-size:14px;display:block;}
.inbox-preview{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.notif{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--brd);}
.notif-icon{font-size:24px;flex-shrink:0;}
.notif-body b{font-size:13px;}
.notif-body p{font-size:11px;color:var(--sub);margin:2px 0;}
.notif.unread{background:rgba(10,60,109,.06);border-radius:10px;padding:10px;}
body.dark .notif.unread{background:rgba(124,184,255,.06);}
.lang-chip{display:inline-block;padding:4px 12px;border-radius:20px;background:#8e44ad;color:#fff;font-size:11px;margin:3px;}
#authScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--hdr);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#authScreen h1{color:#fff;font-size:28px;margin-bottom:4px;}
#authScreen p{color:rgba(255,255,255,.7);margin-bottom:24px;font-size:14px;}
#authScreen input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:12px;padding:13px;margin:5px 0;font-size:15px;width:100%;max-width:360px;}
#authScreen input::placeholder{color:rgba(255,255,255,.5);}
.auth-btn{background:#F39C12;color:#fff;border:none;padding:13px;border-radius:12px;width:100%;max-width:360px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px;}
.auth-switch{color:rgba(255,255,255,.7);font-size:13px;margin-top:14px;cursor:pointer;text-decoration:underline;}
.auth-err{color:#ff6b6b;font-size:13px;margin-top:8px;text-align:center;max-width:360px;}
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;display:none;align-items:center;justify-content:center;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top:4px solid #fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<div id="authScreen">
  <h1>🎓 StudyLink</h1>
  <p>Connect. Study. Grow.</p>

  <!-- LOGIN FORM -->
  <div id="loginForm" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <input id="authEmail" type="email" placeholder="Email address">
    <input id="authPass" type="password" placeholder="Password (min 6 chars)">
    <div id="authErr" class="auth-err"></div>
    <button class="auth-btn" onclick="doAuth()">🔐 Login</button>
    <div class="auth-switch" onclick="showRegister()">Don't have an account? Register →</div>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerForm" style="width:100%;display:none;flex-direction:column;align-items:center;">
    <input id="regName" placeholder="Full Name">
    <input id="regEmail" type="email" placeholder="Email address">
    <input id="regPass" type="password" placeholder="Password (min 6 chars)">
    <div id="regErr" class="auth-err"></div>
    <button class="auth-btn" onclick="doRegister()">✅ Create Account</button>
    <div class="auth-switch" onclick="showLogin()">← Already have an account? Login</div>
  </div>
</div>

<div id="toast"></div>
<div class="hdr">
  <div style="font-size:18px;font-weight:bold;">StudyLink 🎓</div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="topUserName" style="font-size:12px;color:rgba(255,255,255,.8);"></span>
    <button class="dark-btn" onclick="toggleDark()">🌙</button>
    <button class="dark-btn" onclick="doSignOut()">🚪</button>
  </div>
</div>

<div id="home" class="page active-page">
  <h3>Community Feed 🏠</h3>
  <div id="feedList"><p style="text-align:center;color:#888;">Loading...</p></div>
</div>

<div id="find" class="page">
  <h3>Find & Match 🔍</h3>
  <input placeholder="Search name or country..." onkeyup="renderFind(this.value)" id="findQ">
  <div class="stabs">
    <button class="stab active" onclick="switchFindTab('all',this)">All</button>
    <button class="stab" onclick="switchFindTab('match',this)">🤝 Matches</button>
    <button class="stab" onclick="switchFindTab('fav',this)">⭐ Favourites</button>
  </div>
  <div id="findList"></div>
</div>

<div id="post" class="page">
  <h3>Create a Post ➕</h3>
  <div class="card">
    <label><b>Post As:</b></label>
    <select id="postType"><option value="Individual">Individual</option><option value="Group">Study Group</option></select>
    <label><b>Subject Tags:</b></label>
    <div class="tag-wrap" id="tagSel"></div>
    <label><b>Your Message:</b></label>
    <textarea id="postText" rows="4" placeholder="Write your study request or offer..."></textarea>
    <button class="btn" onclick="addPost()">📢 Post to Feed</button>
  </div>
</div>

<div id="messages" class="page">
  <h3>Messages 💬</h3>
  <div class="card" style="padding:0;overflow:hidden;" id="inboxList">
    <p style="text-align:center;color:#888;padding:20px;">No conversations yet.</p>
  </div>
</div>

<div id="notifs" class="page">
  <h3>Notifications 🔔</h3>
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
    <button onclick="clearNotifs()" style="background:none;border:none;color:var(--btnB);font-weight:bold;cursor:pointer;font-size:13px;">Clear all</button>
  </div>
  <div class="card" id="notifList"></div>
</div>

<div id="me" class="page">
  <h3>My Profile 👤</h3>
  <div class="card" style="text-align:center;">
    <div class="avatar" id="myPic" style="margin:0 auto 8px;width:80px;height:80px;font-size:30px;">👤</div>
    <input id="uName" placeholder="Full Name">
    <select id="uCountry"><option value="" disabled selected>Select Country</option></select>
    <input id="uUni" placeholder="University">
    <input id="uCourse" placeholder="Course / Major">
    <input id="uYear" placeholder="Year of Study">
    <label style="font-size:13px;font-weight:bold;display:block;text-align:left;margin-top:6px;">🗣️ Languages Spoken</label>
    <input id="uLangs" placeholder="e.g. English, Spanish, French">
    <div style="display:flex;gap:8px;margin:12px 0;">
      <button onclick="setStatus('Online')" style="flex:1;padding:9px;border-radius:10px;border:none;background:var(--green);color:#fff;font-weight:bold;cursor:pointer;">🟢 Online</button>
      <button onclick="setStatus('Busy')" style="flex:1;padding:9px;border-radius:10px;border:none;background:#e74c3c;color:#fff;font-weight:bold;cursor:pointer;">🔴 Busy</button>
    </div>
    <button class="btn" onclick="saveProfile()">💾 Save Profile</button>
  </div>
</div>

<div id="chatWin">
  <div id="chatHdr">
    <button onclick="closeChat()" style="color:#fff;background:none;border:none;font-size:22px;cursor:pointer;">←</button>
    <b id="chatTitle">Chat</b>
    <span></span>
  </div>
  <div id="msgBox"></div>
  <div class="chat-bottom">
    <div class="cin-row">
      <input id="mInput" placeholder="Type a message...">
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<div class="nav">
  <div onclick="tab('home')" id="n-home" class="ni active"><span class="ni-icon">🏠</span>Home</div>
  <div onclick="tab('find')" id="n-find" class="ni"><span class="ni-icon">🔍</span>Find</div>
  <div onclick="tab('post')" id="n-post" class="ni"><span class="ni-icon">➕</span>Post</div>
  <div onclick="tab('messages')" id="n-messages" class="ni"><span class="ni-icon">💬</span>Messages</div>
  <div onclick="tab('notifs')" id="n-notifs" class="ni"><span class="ni-icon">🔔</span>Alerts<span id="notifBadge" class="nbadge" style="display:none;">0</span></div>
  <div onclick="tab('me')" id="n-me" class="ni"><span class="ni-icon">👤</span>Me</div>
</div>

<script>
const SUBJECTS=["Math","Physics","Chemistry","Biology","CS","English","History","Economics","Law","Medicine","Engineering","Business","Psychology","Art","Music","Geography","Languages","Philosophy"];
const worldList=["Afghanistan","Albania","Algeria","Argentina","Australia","Austria","Azerbaijan","Bahrain","Bangladesh","Belarus","Belgium","Bolivia","Brazil","Bulgaria","Cambodia","Cameroon","Canada","Chile","China","Colombia","Croatia","Cuba","Cyprus","Czech Republic","Denmark","Ecuador","Egypt","Ethiopia","Finland","France","Germany","Ghana","Greece","Hungary","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kuwait","Lebanon","Malaysia","Mexico","Morocco","Netherlands","New Zealand","Nigeria","Norway","Pakistan","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Saudi Arabia","Senegal","Serbia","Singapore","South Africa","South Korea","Spain","Sri Lanka","Sweden","Switzerland","Syria","Taiwan","Tanzania","Thailand","Tunisia","Turkey","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];

const firebaseConfig={
  apiKey:"AIzaSyBQXvheNG_6r5NYjwru_0l_EUsKYrT4w1g",
  authDomain:"studylink-e1803.firebaseapp.com",
  projectId:"studylink-e1803",
  storageBucket:"studylink-e1803.firebasestorage.app",
  messagingSenderId:"51988890739",
  appId:"1:51988890739:web:fa5b3486e7a32c3fe95606",
  measurementId:"G-YG8QYK9S8R"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();

let currentUser=null,myProfile=null,allUsers=[],allPosts=[],notifications=[];
let selTags=[],findTab='all',darkMode=false,currentChat=null,favs=new Set();
let isLoginMode=true,chatUnsub=null,myStatus='Online';

// AUTH STATE
auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser=user;
    document.getElementById('authScreen').style.display='none';
    document.getElementById('topUserName').textContent=user.email.split('@')[0];
    await loadMyProfile();
    listenPosts();
    loadUsers();
  }else{
    document.getElementById('authScreen').style.display='flex';
  }
});

// AUTH
function showRegister(){
  document.getElementById('loginForm').style.display='none';
  document.getElementById('registerForm').style.display='flex';
}
function showLogin(){
  document.getElementById('registerForm').style.display='none';
  document.getElementById('loginForm').style.display='flex';
}

async function doAuth(){
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value.trim();
  if(!email||!pass){document.getElementById('authErr').textContent='Please fill all fields';return;}
  showLoading(true);
  try{
    await auth.signInWithEmailAndPassword(email,pass);
  }catch(e){
    document.getElementById('authErr').textContent=friendlyError(e.code);
  }
  showLoading(false);
}

async function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPass').value.trim();
  if(!name||!email||!pass){document.getElementById('regErr').textContent='Please fill all fields';return;}
  if(pass.length<6){document.getElementById('regErr').textContent='Password must be at least 6 characters';return;}
  showLoading(true);
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    await db.collection('users').doc(cred.user.uid).set({
      name,email,country:'',uni:'',course:'',year:'',langs:[],
      status:'Online',uid:cred.user.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    document.getElementById('regErr').textContent=friendlyError(e.code);
  }
  showLoading(false);
}

function friendlyError(code){
  const map={'auth/user-not-found':'No account found','auth/wrong-password':'Wrong password',
    'auth/email-already-in-use':'Email already registered','auth/weak-password':'Password must be 6+ chars',
    'auth/invalid-email':'Invalid email','auth/invalid-credential':'Wrong email or password'};
  return map[code]||'Error: '+code;
}
async function doSignOut(){if(confirm('Sign out?')){await auth.signOut();location.reload();}}

// LOADING
function showLoading(v){document.getElementById('loadingOverlay').style.display=v?'flex':'none';}

// PROFILE
async function loadMyProfile(){
  try{
    const snap=await db.collection('users').doc(currentUser.uid).get();
    if(snap.exists){
      myProfile=snap.data();
      document.getElementById('uName').value=myProfile.name||'';
      document.getElementById('uUni').value=myProfile.uni||'';
      document.getElementById('uCourse').value=myProfile.course||'';
      document.getElementById('uYear').value=myProfile.year||'';
      document.getElementById('uLangs').value=(myProfile.langs||[]).join(', ');
      if(myProfile.country)document.getElementById('uCountry').value=myProfile.country;
      myStatus=myProfile.status||'Online';
    }
  }catch(e){console.log('Profile load:',e);}
}

async function saveProfile(){
  if(!currentUser)return;
  showLoading(true);
  const langs=document.getElementById('uLangs').value.split(',').map(l=>l.trim()).filter(Boolean);
  const data={
    name:document.getElementById('uName').value.trim(),
    country:document.getElementById('uCountry').value||'',
    uni:document.getElementById('uUni').value.trim(),
    course:document.getElementById('uCourse').value.trim(),
    year:document.getElementById('uYear').value.trim(),
    langs,status:myStatus,email:currentUser.email,uid:currentUser.uid
  };
  try{
    await db.collection('users').doc(currentUser.uid).set(data,{merge:true});
    myProfile=data;showToast('✅ Profile saved!');loadUsers();
  }catch(e){showToast('❌ Error: '+e.message);}
  showLoading(false);
}

function setStatus(s){myStatus=s;showToast(s==='Online'?'🟢 Set to Online':'🔴 Set to Busy');}

// USERS
async function loadUsers(){
  try{
    const snap=await db.collection('users').get();
    allUsers=snap.docs.map(d=>d.data()).filter(u=>u.uid!==currentUser?.uid);
    renderFind();
  }catch(e){console.log('Users:',e);}
}

// POSTS
function listenPosts(){
  db.collection('posts').orderBy('createdAt','desc').onSnapshot(snap=>{
    allPosts=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderHome();
  },e=>console.log('Posts:',e));
}



async function addPost(){
  if(!myProfile?.name)return alert('Complete your profile first (Me tab)');
  const text=document.getElementById('postText').value.trim();
  if(!text)return alert('Write something first');
  showLoading(true);
  try{
    await db.collection('posts').add({
      type:document.getElementById('postType').value,
      text,tags:[...selTags],
      user:{name:myProfile.name,country:myProfile.country,uni:myProfile.uni,
            course:myProfile.course,year:myProfile.year,status:myStatus},
      uid:currentUser.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    selTags=[];document.querySelectorAll('#tagSel .tag').forEach(b=>b.classList.remove('sel'));
    document.getElementById('postText').value='';
    showToast('📢 Post published!');tab('home');
  }catch(e){showToast('❌ '+e.message);}
  showLoading(false);
}

async function deletePost(id){
  if(!confirm('Delete this post?'))return;
  await db.collection('posts').doc(id).delete();
  showToast('🗑️ Deleted.');
}

function renderHome(){
  const feed=document.getElementById('feedList');
  if(!allPosts.length){feed.innerHTML="<p style='text-align:center;color:#888;'>No posts yet. Create one!</p>";return;}
  feed.innerHTML='';
  allPosts.forEach(p=>{
    const isG=p.type==="Group",isOwn=p.uid===currentUser?.uid;
    const tagsHtml=(p.tags||[]).map(t=>`<span class="tbadge">${t}</span>`).join('');
    feed.innerHTML+=`<div class="card ${isG?'grp':''}">
      <div class="row">
        <div class="avatar">👤</div>
        <div class="details"><b>${p.user?.name||'?'}${isG?' <span style="color:#F39C12;">(Group)</span>':''}</b>
        <p>🌍 ${p.user?.country||''} | 🏛️ ${p.user?.uni||''}</p>
        <p>📖 ${p.user?.course||''} ${p.user?.year?'('+p.user.year+')':''}</p></div>
      </div>
      ${tagsHtml?`<div style="margin-bottom:6px;">${tagsHtml}</div>`:''}
      <p style="margin:6px 0;font-size:14px;">${p.text}</p>
      <div style="display:flex;gap:5px;">
        <button class="btn ${isG?'o':''}" style="flex:1;" onclick="openChat('${p.user?.name}','${p.uid}')">
          ${isG?'🤝 Join Group':'💬 Message'}</button>
        ${isOwn?`<button class="btn r" style="width:auto;padding:11px 13px;" onclick="deletePost('${p.id}')">🗑️</button>`:''}
      </div>
      <div class="badge-status">${p.user?.status==='Busy'?'🔴 Busy':'🟢 Online'}</div>
    </div>`;
  });
}

// FIND
function switchFindTab(t,el){findTab=t;document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderFind();}
function toggleFav(uid){favs.has(uid)?favs.delete(uid):favs.add(uid);showToast(favs.has(uid)?'⭐ Favourited!':'💔 Removed');renderFind();}
function matchScore(u){
  if(!myProfile)return 0;let s=0;
  if(u.country&&u.country===myProfile.country)s+=35;
  if(u.uni&&u.uni===myProfile.uni)s+=35;
  if(u.course&&u.course===myProfile.course)s+=30;
  return s;
}
function renderFind(q=""){
  const el=document.getElementById('findList');el.innerHTML='';
  let list=findTab==='fav'?allUsers.filter(u=>favs.has(u.uid)):[...allUsers];
  if(q)list=list.filter(u=>(u.name||'').toLowerCase().includes(q.toLowerCase())||(u.country||'').toLowerCase().includes(q.toLowerCase()));
  if(findTab==='match')list.sort((a,b)=>matchScore(b)-matchScore(a));
  if(!list.length){el.innerHTML="<p style='text-align:center;color:#888;'>No students found.</p>";return;}
  list.forEach(u=>{
    const isFav=favs.has(u.uid),score=matchScore(u);
    const langsHtml=(u.langs||[]).map(l=>`<span class="lang-chip">${l}</span>`).join('');
    el.innerHTML+=`<div class="card">
      <button class="fav-btn" onclick="toggleFav('${u.uid}')">${isFav?'⭐':'☆'}</button>
      <div class="row">
        <div class="avatar">👤</div>
        <div class="details"><b>${u.name||'?'}</b><p>🌍 ${u.country||''}</p>
        <p>🏛️ ${u.uni||''}</p><p>📖 ${u.course||''} ${u.year?'('+u.year+')':''}</p></div>
      </div>
      ${langsHtml?`<div style="margin:4px 0;">${langsHtml}</div>`:''}
      ${findTab==='match'&&myProfile?`<div style="background:linear-gradient(135deg,var(--btnB),#1a6bb5);color:#fff;border-radius:12px;padding:10px;margin:6px 0;">
        <b style="font-size:26px;">${score}%</b> Match
        <div style="height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin:5px 0;">
          <div style="height:100%;width:${score}%;background:#fff;border-radius:3px;"></div></div>
      </div>`:''}
      <button class="btn" onclick="openChat('${u.name}','${u.uid}')">💬 Message</button>
    </div>`;
  });
}

// CHAT
function getChatId(uid1,uid2){return [uid1,uid2].sort().join('_');}
function openChat(name,uid){
  if(!uid||uid==='undefined'){showToast('❌ Cannot open chat');return;}
  currentChat={name,uid};
  document.getElementById('chatTitle').textContent=name;
  document.getElementById('chatWin').style.display='flex';
  document.getElementById('msgBox').innerHTML='';
  if(chatUnsub)chatUnsub();
  const chatId=getChatId(currentUser.uid,uid);
  chatUnsub=db.collection('chats').doc(chatId).collection('messages')
    .orderBy('createdAt').onSnapshot(snap=>{
      const mb=document.getElementById('msgBox');mb.innerHTML='';
      snap.docs.forEach(d=>{
        const m=d.data(),self=m.senderUid===currentUser.uid;
        mb.innerHTML+=`<div class="bw ${self?'self':'other'}">
          <div class="bubble ${self?'self':'other'}">${m.text}
          <div class="btime">${m.time||''}</div></div></div>`;
      });
      mb.scrollTop=mb.scrollHeight;
    },e=>console.log('Chat:',e));
}
function closeChat(){
  document.getElementById('chatWin').style.display='none';
  if(chatUnsub){chatUnsub();chatUnsub=null;}
  currentChat=null;
}
async function sendMsg(){
  const inp=document.getElementById('mInput');
  if(!inp.value.trim()||!currentChat)return;
  const text=inp.value.trim();inp.value='';
  const chatId=getChatId(currentUser.uid,currentChat.uid);
  const d=new Date(),time=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  try{
    await db.collection('chats').doc(chatId).collection('messages').add({
      text,senderUid:currentUser.uid,senderName:myProfile?.name||'Me',
      time,createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){showToast('❌ '+e.message);}
}

// NOTIFICATIONS
function addNotif(icon,title,body){notifications.unshift({icon,title,body,read:false});updateNotifBadge();renderNotifs();}
function renderNotifs(){
  const el=document.getElementById('notifList');
  if(!notifications.length){el.innerHTML="<p style='text-align:center;color:#888;'>No notifications</p>";return;}
  el.innerHTML='';
  notifications.forEach((n,i)=>{
    el.innerHTML+=`<div class="notif ${n.read?'':'unread'}" onclick="markRead(${i})">
      <div class="notif-icon">${n.icon}</div>
      <div class="notif-body"><b>${n.title}</b><p>${n.body}</p></div></div>`;
  });
}
function markRead(i){notifications[i].read=true;updateNotifBadge();renderNotifs();}
function clearNotifs(){notifications=[];updateNotifBadge();renderNotifs();}
function updateNotifBadge(){
  const cnt=notifications.filter(n=>!n.read).length;
  const nb=document.getElementById('notifBadge');
  nb.textContent=cnt;nb.style.display=cnt>0?'flex':'none';
}

// HELPERS
function toggleDark(){darkMode=!darkMode;document.body.classList.toggle('dark',darkMode);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500);}
function tab(id){
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));
  document.getElementById('n-'+id).classList.add('active');
  if(id==='find')renderFind(document.getElementById('findQ')?.value||'');
  if(id==='notifs'){notifications.forEach(n=>n.read=true);updateNotifBadge();renderNotifs();}
}

window.onload=()=>{
  const uc=document.getElementById('uCountry');
  worldList.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;uc.appendChild(o);});
  const ts=document.getElementById('tagSel');
  SUBJECTS.forEach(s=>{
    const b=document.createElement('button');b.className='tag';b.textContent=s;b.type='button';
    b.onclick=()=>{if(selTags.includes(s)){selTags=selTags.filter(t=>t!==s);b.classList.remove('sel');}else{selTags.push(s);b.classList.add('sel');}};
    ts.appendChild(b);
  });
  document.getElementById('mInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
};
</script>
