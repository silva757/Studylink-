<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyLink Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-storage-compat.min.js"></script>

<style>
:root{--hdr:#021841;--bg:#E5EEF9;--btnB:#0A3C6D;--btnO:#F39C12;--green:#2ECC71;--card:#fff;--txt:#111;--sub:#555;--brd:#ccc;--nav:#fff;--inp:#fff;}
body.dark{--bg:#0f1923;--card:#1a2636;--txt:#f0f0f0;--sub:#aab;--brd:#2e3f52;--nav:#121e2d;--inp:#1a2636;--hdr:#0a1e35;}
*{box-sizing:border-box;transition:all .3s;}
body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);padding-bottom:110px;color:var(--txt);}
.hdr{background:var(--hdr);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;}
.page{max-width:500px;margin:auto;padding:14px;display:none;}
.active-page{display:block;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.1);position:relative;}
.avatar{width:80px;height:80px;border-radius:50%;overflow:hidden;position:relative;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:32px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.status-dot{position:absolute;bottom:6px;right:6px;width:20px;height:20px;border:3px solid #fff;border-radius:50%;background:#2ECC71;}
.btn{background:var(--btnB);color:#fff;border:none;padding:13px;border-radius:10px;width:100%;font-weight:bold;cursor:pointer;margin:8px 0;}
.btn.o{background:var(--btnO);}
.auth-btn{background:#F39C12;}
.nav{position:fixed;bottom:0;width:100%;background:var(--nav);display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid var(--brd);z-index:1000;}
.ni{text-align:center;font-size:10px;color:#7f8c8d;cursor:pointer;flex:1;}
.ni.active{color:var(--btnB);font-weight:bold;}
.ni-icon{font-size:24px;display:block;}
.nbadge{position:absolute;top:-6px;right:15px;background:#e74c3c;color:#fff;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;}
input,textarea,select{width:100%;padding:13px;margin:8px 0;border:1px solid var(--brd);border-radius:10px;background:var(--inp);font-size:15px;}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#021841;color:#fff;padding:12px 20px;border-radius:25px;z-index:9999;display:none;}
</style>
</head>
<body>
<!-- ================== AUTH SCREEN ================== -->
<div id="authScreen" style="position:fixed;inset:0;background:var(--hdr);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;">
  <h1>🎓 StudyLink</h1>
  <p>Connect. Study. Grow.</p>
  
  <input id="authEmail" type="email" placeholder="Email address" style="max-width:380px;">
  <input id="authPass" type="password" placeholder="Password (min 6 characters)" style="max-width:380px;">
  
  <div id="authNameWrap" style="display:none;width:100%;max-width:380px;">
    <input id="authName" placeholder="Full Name" style="max-width:380px;">
  </div>

  <div id="authErr" style="color:#ff6b6b;margin:12px 0;min-height:24px;"></div>

  <!-- Boutons Login et Register -->
  <button class="btn" onclick="doLogin()" style="max-width:380px;">🔑 Login</button>
  <button class="btn auth-btn" onclick="doRegister()" style="max-width:380px;">📝 Create New Account</button>

  <div onclick="toggleAuthUI()" id="switchText" style="margin-top:20px;cursor:pointer;text-decoration:underline;">
    Don't have an account? Register
  </div>
</div>

<!-- Le reste de l'application -->
<div class="hdr">
  <div style="font-size:19px;font-weight:bold;">StudyLink 🎓</div>
  <div id="topUserName"></div>
</div>

<div id="home" class="page active-page"><h3>Community Feed 🏠</h3><div id="feedList"></div></div>
<div id="find" class="page"><h3>Find Students 🔍</h3><input id="findQ" placeholder="Search..." onkeyup="renderFind()"><div id="findList"></div></div>
<div id="post" class="page"> ... (le reste reste identique) ... </div>
<!-- Je garde le reste court pour l'instant, dis-moi si tu veux tout le code complet -->

<script>
// ================== FIREBASE CONFIG ==================
const firebaseConfig = {
  apiKey: "AIzaSyBQXvheNG_6r5NYjwru_0l_EUsKYrT4w1g",
  authDomain: "studylink-e1803.firebaseapp.com",
  projectId: "studylink-e1803",
  storageBucket: "studylink-e1803.firebasestorage.app",
  messagingSenderId: "51988890739",
  appId: "1:51988890739:web:fa5b3486e7a32c3fe95606"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

// ================== AUTH FUNCTIONS ==================
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('topUserName').textContent = user.email.split('@')[0];
    // Charger le profil etc.
    console.log("✅ Logged in as:", user.email);
  } else {
    document.getElementById('authScreen').style.display = 'flex';
  }
});

function toggleAuthUI() {
  const nameWrap = document.getElementById('authNameWrap');
  const switchText = document.getElementById('switchText');
  
  if (nameWrap.style.display === 'none') {
    nameWrap.style.display = 'block';
    switchText.textContent = "Already have an account? Login";
  } else {
    nameWrap.style.display = 'none';
    switchText.textContent = "Don't have an account? Register";
  }
}
async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value.trim();
  const errDiv = document.getElementById('authErr');

  if (!email || !pass) {
    errDiv.textContent = "Please enter email and password";
    return;
  }

  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch (e) {
    errDiv.textContent = e.message;
  }
}

async function doRegister() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value.trim();
  const name = document.getElementById('authName').value.trim();
  const errDiv = document.getElementById('authErr');

  if (!email || !pass || !name) {
    errDiv.textContent = "All fields are required (Name + Email + Password)";
    return;
  }
  if (pass.length < 6) {
    errDiv.textContent = "Password must be at least 6 characters";
    return;
  }

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.collection('users').doc(cred.user.uid).set({
      name: name,
      email: email,
      uid: cred.user.uid,
      photoURL: '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast("✅ Account created successfully!");
  } catch (e) {
    errDiv.textContent = e.message;
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  t.style.display = 'block';
  setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
