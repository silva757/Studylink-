<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyLink Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-storage-compat.min.js"></script>

<style>
:root{--hdr:#021841;--bg:#E5EEF9;--btnB:#0A3C6D;--btnO:#F39C12;--green:#2ECC71;--card:#fff;--txt:#111;--sub:#555;--brd:#ccc;--nav:#fff;--inp:#fff;}
body.dark{--bg:#0f1923;--card:#1a2636;--txt:#f0f0f0;--sub:#aab;--brd:#2e3f52;--nav:#121e2d;--inp:#1a2636;--hdr:#0a1e35;}
*{box-sizing:border-box;transition:all .3s;}
body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);padding-bottom:110px;color:var(--txt);}
.hdr{background:var(--hdr);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;}
.page{max-width:500px;margin:auto;padding:14px;display:none;}
.active-page{display:block;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.1);position:relative;}
.avatar{width:80px;height:80px;border-radius:50%;overflow:hidden;position:relative;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:32px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.status-dot{position:absolute;bottom:6px;right:6px;width:20px;height:20px;border:3px solid #fff;border-radius:50%;background:#2ECC71;}
.btn{background:var(--btnB);color:#fff;border:none;padding:13px;border-radius:10px;width:100%;font-weight:bold;cursor:pointer;margin:8px 0;}
.btn.o{background:var(--btnO);}
.auth-btn{background:#F39C12;}
.nav{position:fixed;bottom:0;width:100%;background:var(--nav);display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid var(--brd);z-index:1000;}
.ni{text-align:center;font-size:10px;color:#7f8c8d;cursor:pointer;flex:1;position:relative;}
.ni.active{color:var(--btnB);font-weight:bold;}
.ni-icon{font-size:24px;display:block;}
.nbadge{position:absolute;top:-6px;right:15px;background:#e74c3c;color:#fff;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;}
input,textarea,select{width:100%;padding:13px;margin:8px 0;border:1px solid var(--brd);border-radius:10px;background:var(--inp);font-size:15px;}
.tag{padding:6px 12px;border-radius:20px;font-size:12px;border:2px solid var(--btnB);color:var(--btnB);cursor:pointer;margin:3px;}
.tag.sel{background:var(--btnB);color:#fff;}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#021841;color:#fff;padding:12px 20px;border-radius:25px;z-index:9999;display:none;}
</style>
</head>
<body>
<!-- AUTH SCREEN -->
<div id="authScreen" style="position:fixed;inset:0;background:var(--hdr);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;">
  <h1>🎓 StudyLink</h1>
  <p>Connect. Study. Grow.</p>
  
  <input id="authEmail" type="email" placeholder="Email address" style="max-width:380px;">
  <input id="authPass" type="password" placeholder="Password (min 6)" style="max-width:380px;">
  
  <div id="authNameWrap" style="display:none;width:100%;max-width:380px;">
    <input id="authName" placeholder="Full Name">
  </div>

  <div id="authErr" style="color:#ff6b6b;margin:15px 0;min-height:25px;"></div>

  <button class="btn" onclick="doLogin()" style="max-width:380px;">🔑 Login</button>
  <button class="btn auth-btn" onclick="doRegister()" style="max-width:380px;">📝 Create New Account</button>

  <div onclick="toggleAuthUI()" id="switchText" style="margin-top:25px;cursor:pointer;text-decoration:underline;">
    Don't have an account? Create one
  </div>
</div>

<!-- HEADER -->
<div class="hdr">
  <div style="font-size:19px;font-weight:bold;">StudyLink 🎓</div>
  <div id="topUserName"></div>
</div>

<!-- PAGES -->
<div id="home" class="page active-page"><h3>Community Feed 🏠</h3><div id="feedList">Loading...</div></div>
<div id="find" class="page"><h3>Find Students 🔍</h3><input id="findQ" placeholder="Search..." onkeyup="renderFind()"><div id="findList"></div></div>
<div id="post" class="page"><h3>Create Post ➕</h3><div class="card" id="postCard"></div></div>
<div id="messages" class="page"><h3>Messages 💬</h3><div id="inboxList">No messages yet</div></div>
<div id="notifs" class="page"><h3>Notifications 🔔</h3><div id="notifList">No notifications</div></div>
<div id="me" class="page"><h3>My Profile 👤</h3><div class="card" id="profileCard"></div></div>

<!-- BOTTOM NAV -->
<div class="nav">
  <div onclick="tab('home')" class="ni active"><span class="ni-icon">🏠</span>Home</div>
  <div onclick="tab('find')" class="ni"><span class="ni-icon">🔍</span>Find</div>
  <div onclick="tab('post')" class="ni"><span class="ni-icon">➕</span>Post</div>
  <div onclick="tab('messages')" class="ni"><span class="ni-icon">💬</span>Messages</div>
  <div onclick="tab('me')" class="ni"><span class="ni-icon">👤</span>Me</div>
</div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBQXvheNG_6r5NYjwru_0l_EUsKYrT4w1g",
  authDomain: "studylink-e1803.firebaseapp.com",
  projectId: "studylink-e1803",
  storageBucket: "studylink-e1803.firebasestorage.app",
  messagingSenderId: "51988890739",
  appId: "1:51988890739:web:fa5b3486e7a32c3fe95606"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let myProfile = null;

// Auth State
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('topUserName').textContent = user.email.split('@')[0];
    await loadMyProfile();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
  }
});

// Toggle Login / Register
function toggleAuthUI() {
  const wrap = document.getElementById('authNameWrap');
  const text = document.getElementById('switchText');
  if (wrap.style.display === 'none') {
    wrap.style.display = 'block';
    text.textContent = "Already have an account? Login";
  } else {
    wrap.style.display = 'none';
    text.textContent = "Don't have an account? Create one";
  }
}

// Login
async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value.trim();
  const err = document.getElementById('authErr');

  if (!email || !pass) return err.textContent = "Enter email and password";

  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch (e) {
    err.textContent = e.message;
  }
}

// Register
async function doRegister() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value.trim();
  const name = document.getElementById('authName').value.trim();
  const err = document.getElementById('authErr');

  if (!email || !pass || !name) return err.textContent = "All fields are required";

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.collection('users').doc(cred.user.uid).set({
      name, email, uid: cred.user.uid, photoURL: ''
    });
    err.style.color = '#2ECC71';
    err.textContent = "✅ Account created! Logging in...";
  } catch (e) {
    err.textContent = e.message;
  }
}
// Profile
async function loadMyProfile() {
  const snap = await db.collection('users').doc(currentUser.uid).get();
  myProfile = snap.data() || {};
}

// Navigation
function tab(page) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById(page).style.display = 'block';
  
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
  document.querySelector(`[onclick="tab('${page}')"]`).classList.add('active');
}

// Toast
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  t.style.display = 'block';
  setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
