<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyLink Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-storage-compat.min.js"></script>

<style>
:root{--hdr:#021841;--bg:#E5EEF9;--btnB:#0A3C6D;--btnO:#F39C12;--green:#2ECC71;--card:#fff;--txt:#111;--sub:#555;--brd:#ccc;--nav:#fff;--inp:#fff;}
body.dark{--bg:#0f1923;--card:#1a2636;--txt:#f0f0f0;--sub:#aab;--brd:#2e3f52;--nav:#121e2d;--inp:#1a2636;--hdr:#0a1e35;}
*{box-sizing:border-box;transition:all .3s;}
body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);padding-bottom:110px;color:var(--txt);}
.hdr{background:var(--hdr);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;}
.page{max-width:500px;margin:auto;padding:14px;display:none;}
.active-page{display:block;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.1);position:relative;}
.avatar{width:80px;height:80px;border-radius:50%;overflow:hidden;position:relative;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.status-dot{position:absolute;bottom:6px;right:6px;width:20px;height:20px;border:3px solid #fff;border-radius:50%;background:#2ECC71;}
.row{display:flex;gap:12px;margin-bottom:12px;}
.btn{background:var(--btnB);color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:bold;cursor:pointer;}
.btn.o{background:var(--btnO);}
.nav{position:fixed;bottom:0;width:100%;background:var(--nav);display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid var(--brd);z-index:1000;}
.ni{text-align:center;font-size:10px;color:#7f8c8d;cursor:pointer;flex:1;}
.ni.active{color:var(--btnB);font-weight:bold;}
.ni-icon{font-size:24px;display:block;}
.nbadge{position:absolute;top:-6px;right:15px;background:#e74c3c;color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid var(--brd);border-radius:10px;background:var(--inp);}
.tag-wrap{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.tag{padding:6px 12px;border-radius:20px;font-size:12px;border:2px solid var(--btnB);color:var(--btnB);cursor:pointer;}
.tag.sel{background:var(--btnB);color:#fff;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#021841;color:#fff;padding:10px 20px;border-radius:25px;z-index:9999;white-space:nowrap;display:none;box-shadow:0 4px 15px rgba(0,0,0,.4);}
</style>
</head>
<body>
<div id="authScreen" style="position:fixed;inset:0;background:var(--hdr);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff;">
  <h1>🎓 StudyLink</h1>
  <p>Connect. Study. Grow.</p>
  <input id="authEmail" type="email" placeholder="Email" style="max-width:360px;">
  <input id="authPass" type="password" placeholder="Password (min 6)">
  <div id="authNameWrap" style="display:none;width:100%;max-width:360px;">
    <input id="authName" placeholder="Full Name">
  </div>
  <div id="authErr" style="color:#ff6b6b;margin:10px 0;"></div>
  <button class="btn" onclick="doAuth()" style="max-width:360px;">Login / Register</button>
  <div onclick="toggleAuthMode()" style="margin-top:15px;cursor:pointer;text-decoration:underline;">Switch to Register / Login</div>
</div>

<div class="hdr">
  <div style="font-size:19px;font-weight:bold;">StudyLink 🎓</div>
  <div id="topUserName" style="font-size:14px;"></div>
</div>

<div id="home" class="page active-page"><h3>Community Feed 🏠</h3><div id="feedList"></div></div>
<div id="find" class="page"><h3>Find Students 🔍</h3><input id="findQ" placeholder="Search name or country..." onkeyup="renderFind()"><div id="findList"></div></div>

<div id="post" class="page">
  <h3>Create Post ➕</h3>
  <div class="card">
    <select id="postType"><option value="Individual">Individual</option><option value="Group">Study Group</option></select>
    <label><b>Subject Tags</b></label>
    <div class="tag-wrap" id="tagSel"></div>
    <textarea id="postText" rows="4" placeholder="Write your study request or offer..."></textarea>
    <button class="btn" onclick="addPost()">📢 Post to Feed</button>
  </div>
</div>

<div id="messages" class="page">
  <h3>Messages 💬 <span id="msgBadge" class="nbadge" style="display:none;">0</span></h3>
  <div id="inboxList"></div>
</div>

<div id="notifs" class="page">
  <h3>Notifications 🔔</h3>
  <div id="notifList"></div>
</div>

<div id="me" class="page">
  <h3>My Profile 👤</h3>
  <div class="card" style="text-align:center;">
    <div class="avatar" id="myAvatar">👤<div class="status-dot" id="myStatusDot"></div></div>
    <input type="file" id="profilePic" accept="image/*">
    <input id="uName" placeholder="Full Name">
    <select id="uCountry"></select>
    <input id="uUni" placeholder="University">
    <input id="uCourse" placeholder="Course / Major">
    <input id="uYear" placeholder="Year of Study">
    <button class="btn" onclick="saveProfile()">💾 Update Profile</button>
  </div>
</div>

<div id="chatWin" style="position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;flex-direction:column;">
  <div class="hdr" style="margin:0;">
    <button onclick="closeChat()" style="background:none;border:none;color:#fff;font-size:28px;margin-right:10px;">←</button>
    <b id="chatTitle"></b>
  </div>
  <div id="msgBox" style="flex:1;overflow-y:auto;padding:15px;background:var(--bg);"></div>
  <div style="padding:10px;background:var(--card);display:flex;gap:8px;">
    <input id="mInput" placeholder="Type a message..." style="flex:1;">
    <button onclick="sendMsg()" style="background:var(--btnB);color:#fff;width:50px;border-radius:50%;border:none;">➤</button>
    <button onclick="alert('📷 Image & Files coming soon')" style="background:#eee;width:45px;border-radius:50%;">📎</button>
  </div>
</div>

<div class="nav">
  <div onclick="tab('home')" class="ni active"><span class="ni-icon">🏠</span>Home</div>
  <div onclick="tab('find')" class="ni"><span class="ni-icon">🔍</span>Find</div>
  <div onclick="tab('post')" class="ni"><span class="ni-icon">➕</span>Post</div>
  <div onclick="tab('messages')" class="ni"><span class="ni-icon">💬</span>Messages<span id="messagesBadge" class="nbadge" style="display:none;">0</span></div>
  <div onclick="tab('notifs')" class="ni"><span class="ni-icon">🔔</span>Notifs</div>
  <div onclick="tab('me')" class="ni"><span class="ni-icon">👤</span>Me</div>
</div>

<script>
// ================== FIREBASE ==================
const firebaseConfig = {
  apiKey: "AIzaSyBQXvheNG_6r5NYjwru_0l_EUsKYrT4w1g",
  authDomain: "studylink-e1803.firebaseapp.com",
  projectId: "studylink-e1803",
  storageBucket: "studylink-e1803.firebasestorage.app",
  messagingSenderId: "51988890739",
  appId: "1:51988890739:web:fa5b3486e7a32c3fe95606"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

let currentUser = null, myProfile = null, allUsers = [], allPosts = [], notifications = [];
let currentChat = null, chatUnsub = null;
let unreadMessages = 0;

const SUBJECTS = ["Math","Physics","Chemistry","Biology","Computer Science","JavaScript","Python","Java","Web Development","Mobile Dev","Data Science","AI","Machine Learning","Cybersecurity","English","French","History","Economics","Business","Psychology","Law","Medicine"];

const worldList = ["Uganda","Kenya","Nigeria","India","United States","United Kingdom","Canada","France","Germany","China","Brazil","South Africa","Ghana","Tanzania","Rwanda"];

// ================== AUTH ==================
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('topUserName').textContent = user.email.split('@')[0];
    await loadMyProfile();
    loadUsers();
    listenPosts();
    listenNotifications();
    listenUnreadMessages();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
  }
});

function toggleAuthMode() {
  const wrap = document.getElementById('authNameWrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
}

async function doAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value.trim();
  if (!email || !pass) return setAuthErr("Email and password required");

  try {
    if (document.getElementById('authNameWrap').style.display === 'block') {
      const name = document.getElementById('authName').value.trim();
      if (!name) return setAuthErr("Name required");
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await db.collection('users').doc(cred.user.uid).set({name, email, uid: cred.user.uid, photoURL: '', lastActive: firebase.firestore.FieldValue.serverTimestamp()});
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
  } catch (e) { setAuthErr(e.message); }
}

function setAuthErr(msg) {
  document.getElementById('authErr').textContent = msg;
}
// ================== PROFILE ==================
async function loadMyProfile() {
  const snap = await db.collection('users').doc(currentUser.uid).get();
  myProfile = snap.exists ? snap.data() : {};
  
  const av = document.getElementById('myAvatar');
  if (myProfile.photoURL) av.innerHTML = `<img src="${myProfile.photoURL}"><div class="status-dot"></div>`;
  else av.innerHTML = `👤<div class="status-dot"></div>`;
}

async function saveProfile() {
  const file = document.getElementById('profilePic').files[0];
  let photoURL = myProfile.photoURL || '';

  if (file) {
    const ref = storage.ref('profiles/' + currentUser.uid);
    await ref.put(file);
    photoURL = await ref.getDownloadURL();
  }

  const data = {
    name: document.getElementById('uName').value.trim(),
    country: document.getElementById('uCountry').value,
    uni: document.getElementById('uUni').value.trim(),
    course: document.getElementById('uCourse').value.trim(),
    year: document.getElementById('uYear').value.trim(),
    photoURL,
    lastActive: firebase.firestore.FieldValue.serverTimestamp()
  };

  await db.collection('users').doc(currentUser.uid).set(data, {merge: true});
  myProfile = {...myProfile, ...data};
  loadMyProfile();
  showToast("✅ Profile Updated!");
  document.getElementById('profilePic').value = '';
}

// ================== USERS & FIND ==================
async function loadUsers() {
  const snap = await db.collection('users').get();
  allUsers = snap.docs.map(d => d.data()).filter(u => u.uid !== currentUser.uid);
  renderFind();
}

function renderFind() {
  const q = document.getElementById('findQ').value.toLowerCase();
  const container = document.getElementById('findList');
  container.innerHTML = '';

  let filtered = allUsers.filter(u => 
    (u.name||'').toLowerCase().includes(q) || (u.country||'').toLowerCase().includes(q)
  );

  if (!filtered.length) {
    container.innerHTML = "<p style='text-align:center;color:#888;padding:20px;'>No students found</p>";
    return;
  }

  filtered.forEach(u => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="row">
        <div class="avatar">\( {u.photoURL ? `<img src=" \){u.photoURL}">` : '👤'}<div class="status-dot"></div></div>
        <div class="details" style="flex:1">
          <b>${u.name || 'Unknown'}</b>
          <p>🌍 ${u.country || ''}</p>
          <p>🏛️ ${u.uni || ''} ${u.year ? '('+u.year+')' : ''}</p>
        </div>
      </div>
      <button class="btn" onclick="openChat('\( {u.name}',' \){u.uid}')">💬 Message</button>
    `;
    container.appendChild(div);
  });
}
// ================== POSTS ==================
function listenPosts() {
  db.collection('posts').orderBy('createdAt', 'desc').onSnapshot(snap => {
    allPosts = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderHome();
  });
}

async function addPost() {
  if (!myProfile?.name) return alert("Complete your profile first");
  const text = document.getElementById('postText').value.trim();
  if (!text) return alert("Write something");

  await db.collection('posts').add({
    type: document.getElementById('postType').value,
    text,
    tags: Array.from(document.querySelectorAll('.tag.sel')).map(t => t.textContent),
    user: {name: myProfile.name, photoURL: myProfile.photoURL, country: myProfile.country},
    uid: currentUser.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById('postText').value = '';
  document.querySelectorAll('.tag.sel').forEach(t => t.classList.remove('sel'));
  showToast("📢 Post published!");
  tab('home');
}

function renderHome() {
  const el = document.getElementById('feedList');
  if (!allPosts.length) {
    el.innerHTML = "<p style='text-align:center;color:#888;'>No posts yet...</p>";
    return;
  }
  el.innerHTML = '';
  allPosts.forEach(p => {
    const html = `
      <div class="card">
        <div class="row">
          <div class="avatar">\( {p.user?.photoURL ? `<img src=" \){p.user.photoURL}">` : '👤'}</div>
          <div><b>\( {p.user?.name}</b><p> \){p.user?.country || ''}</p></div>
        </div>
        <p>${p.text}</p>
        <button class="btn" onclick="openChat('\( {p.user?.name}',' \){p.uid}')">💬 Message</button>
      </div>`;
    el.innerHTML += html;
  });
}

// ================== CHAT & INBOX ==================
function getChatId(uid1, uid2) {
  return [uid1, uid2].sort().join('_');
}

function openChat(name, uid) {
  currentChat = {name, uid};
  document.getElementById('chatTitle').textContent = name;
  document.getElementById('chatWin').style.display = 'flex';
  document.getElementById('msgBox').innerHTML = '';

  if (chatUnsub) chatUnsub();
  const chatId = getChatId(currentUser.uid, uid);
  
  chatUnsub = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('createdAt')
    .onSnapshot(snap => {
      const box = document.getElementById('msgBox');
      box.innerHTML = '';
      snap.docs.forEach(doc => {
        const m = doc.data();
        const isMe = m.senderUid === currentUser.uid;
        box.innerHTML += `<div style="text-align:${isMe?'right':'left'};margin:8px 0;">
          <div style="display:inline-block;max-width:80%;padding:10px 14px;border-radius:18px;background:\( {isMe?'#0A3C6D':'#f0f0f0'};color: \){isMe?'#fff':'#000'};">
            ${m.text}
          </div>
        </div>`;
      });
      box.scrollTop = box.scrollHeight;
    });
}

async function sendMsg() {
  const input = document.getElementById('mInput');
  if (!input.value.trim() || !currentChat) return;
  
  const chatId = getChatId(currentUser.uid, currentChat.uid);
  await db.collection('chats').doc(chatId).collection('messages').add({
    text: input.value.trim(),
    senderUid: currentUser.uid,
    senderName: myProfile.name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  input.value = '';
}

// Close Chat
function closeChat() {
  document.getElementById('chatWin').style.display = 'none';
  if (chatUnsub) chatUnsub();
}

// ================== INBOX & NOTIFICATIONS ==================
function listenUnreadMessages() {
  // Simplified version - you can improve later
  setInterval(() => {
    const badge = document.getElementById('messagesBadge');
    // For real app you should count unread messages properly
  }, 5000);
}

function renderInbox() {
  const el = document.getElementById('inboxList');
  el.innerHTML = "<p style='text-align:center;color:#888;padding:30px;'>No conversations yet</p>";
  // You can expand this later
}

function listenNotifications() {
  // Basic notification listener
}

function renderNotifs() {
  document.getElementById('notifList').innerHTML = "<p style='text-align:center;color:#888;padding:30px;'>No new notifications</p>";
}
// ================== HELPERS ==================
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  t.style.display = 'block';
  setTimeout(() => t.remove(), 3000);
}

function tab(id) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById(id).style.display = 'block';
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
  document.querySelector(`[onclick="tab('${id}')"]`).classList.add('active');

  if (id === 'find') renderFind();
  if (id === 'messages') renderInbox();
  if (id === 'notifs') renderNotifs();
}

// ================== INIT ==================
window.onload = () => {
  // Populate countries
  const select = document.getElementById('uCountry');
  worldList.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    select.appendChild(opt);
  });

  // Populate tags
  const tagContainer = document.getElementById('tagSel');
  SUBJECTS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'tag';
    btn.textContent = s;
    btn.onclick = () => btn.classList.toggle('sel');
    tagContainer.appendChild(btn);
  });
};
</script>
</body>
</html>
